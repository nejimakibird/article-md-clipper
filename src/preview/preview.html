<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article Markdown Clipper Preview</title>
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <main id="previewPage" class="preview-page" data-details-expanded="true">
      <header class="preview-header">
        <div>
          <h1>Article Markdown Clipper Preview</h1>
          <p id="status" role="status" aria-live="polite">Loading preview...</p>
        </div>
        <div class="preview-toolbar">
          <section class="view-controls" aria-label="Preview view mode">
            <button id="renderedViewButton" type="button" class="active" aria-pressed="true">Rendered</button>
            <button id="plainTextViewButton" type="button" aria-pressed="false">Plain text</button>
            <button id="splitViewButton" type="button" aria-pressed="false">Split</button>
          </section>
          <div class="actions">
            <button id="copyButton" type="button">Copy</button>
            <button id="downloadButton" type="button">Download .md</button>
            <button
              id="detailsToggleButton"
              type="button"
              class="secondary"
              aria-expanded="true"
              aria-controls="previewDetails"
            >
              Hide details
            </button>
          </div>
        </div>
      </header>
      <div class="preview-shell">
        <section id="previewDetails" class="preview-details" aria-label="Preview details">
          <section class="metadata" aria-label="Markdown metadata">
            <div>
              <span>Filename</span>
              <strong id="filename">-</strong>
            </div>
            <div>
              <span>Characters</span>
              <strong id="characterCount">0</strong>
            </div>
            <div>
              <span>Articles</span>
              <strong id="articleCount">-</strong>
            </div>
            <div>
              <span>Generated</span>
              <strong id="generatedAt">-</strong>
            </div>
            <div class="source">
              <span>Source</span>
              <strong id="sourceUrl">-</strong>
            </div>
          </section>
          <section class="editor-controls" aria-label="Split mode editor controls">
            <label>
              <input id="autoUpdatePreview" type="checkbox" />
              Auto update preview
            </label>
            <button id="updatePreviewButton" type="button">Update preview</button>
            <span id="modifiedStatus" class="modified-status" hidden>Modified</span>
          </section>
          <p id="renderWarning" class="render-warning" hidden>Large Markdown may take a moment to render.</p>
        </section>
        <section class="preview-content mode-rendered" id="previewContent" aria-label="Markdown content">
          <textarea
            id="markdownText"
            class="plain-pane"
            spellcheck="false"
            aria-label="Markdown preview"
          ></textarea>
          <article
            id="renderedMarkdown"
            class="rendered-markdown rendered-pane"
            aria-label="Rendered Markdown preview"
          ></article>
        </section>
      </div>
    </main>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
