<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article Markdown Clipper</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <h1>Article Markdown Clipper</h1>
      <label class="output-control">
        <span>Output</span>
        <select id="outputMode">
          <option value="preview">Preview</option>
          <option value="download">Download file</option>
        </select>
      </label>
      <div class="actions">
        <button id="saveButton" type="button">Save current page as Markdown</button>
        <button id="findLinksButton" type="button" class="secondary">Find links on this page</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="resetJobButton" type="button" class="danger" hidden>Reset stuck job</button>
      <div id="siteSettingsLabel" class="site-settings">Settings for: this site</div>
      <section id="linkResults" class="link-results" hidden>
        <div class="filter-panel" aria-label="Link filters">
          <label class="filter-check">
            <input id="articleLikeOnly" type="checkbox" checked />
            Article-like links only
          </label>
          <label class="filter-check">
            <input id="excludePdf" type="checkbox" checked />
            Exclude PDF links
          </label>
          <label class="filter-check">
            <input id="sameOriginOnly" type="checkbox" checked />
            Same origin only
          </label>
          <input
            id="includeFilter"
            class="text-filter"
            type="search"
            aria-label="Include filter"
            placeholder="Include filter: keyword"
            autocomplete="off"
          />
          <input
            id="excludeFilter"
            class="text-filter"
            type="search"
            aria-label="Exclude filter"
            placeholder="Exclude filter: Video Watch Live"
            autocomplete="off"
          />
          <label class="filter-mode">
            <span>Filter mode</span>
            <select id="filterMode">
              <option value="plain">Plain text</option>
              <option value="regex">Regex</option>
            </select>
          </label>
          <label class="max-control">
            <span>Max articles</span>
            <input id="maxArticlesInput" type="number" min="1" max="30" value="10" />
          </label>
          <label class="fetch-delay-control">
            <span>Fetch delay</span>
            <select id="fetchDelaySelect">
              <option value="0">0 sec</option>
              <option value="300">0.3 sec</option>
              <option value="500">0.5 sec</option>
              <option value="1000" selected>1.0 sec</option>
              <option value="1500">1.5 sec</option>
              <option value="2000">2.0 sec</option>
              <option value="3000">3.0 sec</option>
            </select>
          </label>
        </div>
        <div class="link-summary">
          <span id="totalLinks">0 links found</span>
          <span id="filteredLinks">0 after filters</span>
          <span id="candidatesShown">0 shown</span>
          <span id="selectedCount">0 selected</span>
          <span id="estimatedDelay">Estimated delay wait: 0 sec</span>
        </div>
        <div class="selection-actions">
          <button id="selectTopShownButton" type="button" class="tertiary">Select top 10 shown</button>
          <button id="clearSelectionButton" type="button" class="tertiary">Clear selection</button>
        </div>
        <p id="emptyLinkMessage" class="empty-message" hidden></p>
        <form id="linkList" class="link-list"></form>
        <button id="saveSelectedButton" type="button" class="secondary" disabled>
          Save selected links as Markdown
        </button>
      </section>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
